name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Formatting, Perl::Critic, workflow syntax and leaked secrets (author/lint.sh).
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: "5.44"

      - name: Install perltidy and perlcritic
        run: cpanm --notest Perl::Tidy@20260826 Perl::Critic@1.156

      - name: Install gitleaks and actionlint (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base=https://github.com
          curl -sSfLO "$base/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "$base/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: author/lint.sh

  test:
    # GitHub-hosted runners have no GPU and no driver: build against the CUDA
    # headers and NVRTC. Tests that need a device skip themselves.
    # CUDA 12.0 is the oldest supported toolkit; NVIDIA packages it only for
    # Ubuntu 22.04 and earlier.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.40", "5.42", "5.44"]
        cuda: ["13.3"]
        os: [ubuntu-24.04]
        repo: [ubuntu2404]
        include:
          - perl: "5.40"
            cuda: "12.0"
            os: ubuntu-22.04
            repo: ubuntu2204
    env:
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Headers and NVRTC only: libcuda is loaded at run time, so on these
      # GPU-less runners the module loads and device tests skip.
      - name: Install CUDA headers and NVRTC
        env:
          REPO: ${{ matrix.repo }}
          CUDA: ${{ matrix.cuda }}
        run: |
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/$REPO/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "cuda-cudart-dev-${CUDA/./-}" "cuda-nvrtc-dev-${CUDA/./-}"

      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}

      # With a cpanfile, cpanm installs configure prerequisites (here
      # Module::Build::XSUtil, which Build.PL needs) only with --with-configure.
      - name: Install dependencies
        run: cpanm --notest --with-configure --installdeps .

      - run: perl Build.PL
      - run: ./Build
      # NVRTC finds libnvrtc-builtins only through a DT_RPATH (see
      # builder/MyBuilder.pm); no test can check it without a GPU.
      - name: Check the run path type
        run: readelf -d blib/arch/auto/CUDA/DriverAPI/DriverAPI.so | grep -F '(RPATH)'
      # Only t/: in a git checkout `./Build test` also runs xt/, whose develop
      # prerequisites are installed (and run) in the steps below.
      - run: prove -b t/

      # Author and release tests (POD, spelling, minimum version, Perl::Critic)
      # once, on the latest Perl.
      - name: Install develop dependencies
        if: matrix.perl == '5.44'
        run: cpanm --notest --with-configure --with-develop --installdeps .
      - name: Run author and release tests
        if: matrix.perl == '5.44'
        run: minil test --release
